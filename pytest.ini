[pytest]
minversion = 8.0
# Plain `pytest` runs the deterministic suites only; end-to-end tests need the estate: pytest tests/e2e -m e2e
testpaths = tests/unit tests/bdd
pythonpath = .
norecursedirs = .git .venv runtime demo-fallbacks legacy node_modules reports
addopts = -ra
# Portal URL for pytest-playwright (page.goto("/") opens the estate portal).
base_url = http://localhost:8085
markers =
    e2e: end-to-end test that needs the estate running (python -m estate up)
    story_123: STORY-123 scenarios and tests
    compensation_limit: compensation limit scenarios (sole accounts)
    migrated: tests migrated from the legacy SpecFlow + Selenium suite
    ac_1: acceptance criterion AC1
    ac_2: acceptance criterion AC2
    ac_3: acceptance criterion AC3
    gap_g1: requirements gap G1
    gap_g2: requirements gap G2
    gap_g3: requirements gap G3
    gap_g4: requirements gap G4
    gap_g5: requirements gap G5
    gap_g6: requirements gap G6
# Agents may add new @tags live; do not clutter the output with unknown-marker warnings.
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
