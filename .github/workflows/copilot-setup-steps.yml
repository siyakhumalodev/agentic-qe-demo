# Prepares the environment for the GitHub Copilot cloud agent so it can run this repo's tests.
# The job MUST be called copilot-setup-steps. See: Customizing the development environment for Copilot coding agent.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium (with OS dependencies)
        run: python -m playwright install --with-deps chromium

      - name: Initialise the simulated estate
        run: |
          python -m estate patch-drift off
          python -m estate reset

      - name: Smoke test
        run: python -m pytest tests/unit tests/bdd -q
